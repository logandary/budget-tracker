<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Tracker</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- ===========================
         HEADER
    ============================ -->

    <header class="hero">

        <button
            id="settingsButton"
            class="iconButton"
            aria-label="Settings">

            ⚙

        </button>

<div class="heroContent">

    <h1>
        Budget Tracker
    </h1>

    <p class="subtitle">
        Remaining
    </p>

    <div class="moneySection">

        <div class="remainingAmount">

            <span id="remainingDollars">
                $250
            </span>

            <span id="remainingCents">
                .00
            </span>

        </div>

        <div class="spentSummary">

            <span class="spentLabel">
                Spent This Month
            </span>

            <span id="spentHeader">
                $0.00
            </span>

        </div>

    </div>

</div>

    </header>

    <!-- ===========================
         MAIN CONTENT
    ============================ -->

    <main>

        <!-- Add Expense Button -->

        <button
            id="addExpenseButton"
            class="primaryButton">

            ADD EXPENSE

        </button>

        <!-- Recent History -->

        <section class="historyCard">

            <div class="cardHeader">

                <h2>
                    Recent History
                </h2>

            </div>

            <div
                id="emptyState"
                class="emptyState">

                No expenses yet.

            </div>

            <ul
                id="expenseList"
                class="expenseList">

            </ul>

        </section>

    </main>

    <!-- ===========================
         ADD EXPENSE MODAL
    ============================ -->

    <div
        id="expenseModal"
        class="modal hidden">

        <div class="modalCard">

            <h2>
                Add Expense
            </h2>

            <label>

                Description

                <input
                    id="descriptionInput"
                    type="text"
                    placeholder="Starbucks">

            </label>

            <label>

                Amount

                <input
                    id="amountInput"
                    type="number"
                    step="0.01"
                    placeholder="6.25">

            </label>

            <div class="modalButtons">

                <button
                    id="cancelExpense"
                    class="secondaryButton">

                    Cancel

                </button>

                <button
                    id="saveExpense"
                    class="primaryButton">

                    Save

                </button>

            </div>

        </div>

    </div>

    <!-- ===========================
         SETTINGS MODAL
    ============================ -->

    <div
        id="settingsModal"
        class="modal hidden">

        <div class="modalCard">

            <h2>
                Settings
            </h2>

            <label>

                Monthly Budget

                <input
                    id="budgetInput"
                    type="number"
                    step="0.01">

            </label>

            <div class="settingsSummary">

                <div>

                    <span>Spent</span>

                    <strong id="settingsSpent">

                        $0.00

                    </strong>

                </div>

                <div>

                    <span>Remaining</span>

                    <strong id="settingsRemaining">

                        $250.00

                    </strong>

                </div>

            </div>

            <div class="modalButtons">

                <button
                    id="cancelSettings"
                    class="secondaryButton">

                    Cancel

                </button>

                <button
                    id="saveSettings"
                    class="primaryButton">

                    Save

                </button>

            </div>

        </div>

    </div>

    <!-- ===========================
         EDIT EXPENSE MODAL
    ============================ -->

    <div
        id="editModal"
        class="modal hidden">

        <div class="modalCard">

            <h2>
                Edit Expense
            </h2>

            <label>

                Description

                <input
                    id="editDescription"
                    type="text">

            </label>

            <label>

                Amount

                <input
                    id="editAmount"
                    type="number"
                    step="0.01">

            </label>

            <div class="modalButtons">

                <button
                    id="deleteExpense"
                    class="dangerButton">

                    Delete

                </button>

                <button
                    id="updateExpense"
                    class="primaryButton">

                    Save

                </button>

            </div>

        </div>

    </div>

    <!-- ===========================
         TEMPLATE FOR EXPENSE ROW
         (Hidden - JavaScript clones this)
    ============================ -->

    <template id="expenseTemplate">

        <li class="expenseItem">

            <div class="expenseInfo">

                <div class="expenseDescription">
                    Starbucks
                </div>

                <div class="expenseDate">
                    July 27
                </div>

            </div>

            <div class="expenseAmount">
                $6.25
            </div>

        </li>

    </template>

    <script src="script.js"></script>

</body>
</html>
