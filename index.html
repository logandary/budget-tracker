<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Budget Tracker</title>

    <link rel="stylesheet"
          href="styles.css">

</head>

<body>

<!-- ==========================================
     HOME
========================================== -->

<header class="hero">

    <button
        id="settingsButton"
        class="iconButton"
        aria-label="Settings">

        ⚙

    </button>

    <div class="heroContent">

        <h1>
            Budget Tracker
        </h1>

        <p class="subtitle">
            Remaining
        </p>

        <div class="moneySection">

            <div class="remainingAmount">

                <span id="remainingDollars">
                    $250
                </span>

                <span id="remainingCents">
                    .00
                </span>

            </div>

            <div class="spentSummary">

                <span class="spentLabel">
                    Spent This Month
                </span>

                <span id="spentHeader">
                    $0.00
                </span>

            </div>

        </div>

    </div>

</header>

<main>

    <!-- ===========================
         ADD EXPENSE
    ============================ -->

    <button
        id="addExpenseButton"
        class="primaryButton">

        ADD EXPENSE

    </button>

    <!-- ===========================
         CURRENT MONTH
    ============================ -->

    <section class="historyCard">

        <div class="cardHeader">

            <h2>

                Current Month

            </h2>

        </div>

        <div
            id="emptyState"
            class="emptyState">

            No expenses yet.

        </div>

        <ul
            id="expenseList"
            class="expenseList">

        </ul>

    </section>

</main>

<!-- ==========================================
     ADD EXPENSE MODAL
========================================== -->

<div
    id="expenseModal"
    class="modal hidden">

    <div class="modalCard">

        <h2>

            Add Expense

        </h2>

        <label>

            Description

            <input
                id="descriptionInput"
                type="text"
                placeholder="Starbucks">

        </label>

        <label>

            Amount

            <input
                id="amountInput"
                type="number"
                step="0.01"
                placeholder="6.25">

        </label>

        <div class="modalButtons">

            <button
                id="cancelExpense"
                class="secondaryButton">

                Cancel

            </button>

            <button
                id="saveExpense"
                class="primaryButton">

                Save

            </button>

        </div>

    </div>

</div>

<!-- ==========================================
     SETTINGS MODAL
========================================== -->

<div
    id="settingsModal"
    class="modal hidden">

    <div class="modalCard">

        <h2>

            Settings

        </h2>

        <label>

            Monthly Budget

            <input
                id="budgetInput"
                type="number"
                step="0.01">

        </label>

        <div class="settingsSummary">

            <div>

                <span>Spent</span>

                <strong id="settingsSpent">

                    $0.00

                </strong>

            </div>

            <div>

                <span>Remaining</span>

                <strong id="settingsRemaining">

                    $250.00

                </strong>

            </div>

        </div>

        <button
            id="historyButton"
            class="historyButton">

            View Budget History

        </button>

        <div class="modalButtons">

            <button
                id="cancelSettings"
                class="secondaryButton">

                Cancel

            </button>

            <button
                id="saveSettings"
                class="primaryButton">

                Save

            </button>

        </div>

    </div>

</div>

<!-- ==========================================
     HISTORY MODAL
========================================== -->

<div
    id="historyModal"
    class="modal hidden">

    <div class="modalCard historyModalCard">

        <h2>

            Budget History

        </h2>

        <div
            id="historyList"
            class="historyList">

            <!-- JavaScript inserts months here -->

        </div>

        <div class="modalButtons">

            <button
                id="closeHistory"
                class="secondaryButton">

                Close

            </button>

        </div>

    </div>

</div>

<!-- ==========================================
     MONTH DETAIL MODAL
========================================== -->

<div
    id="monthModal"
    class="modal hidden">

    <div class="modalCard monthModalCard">

        <h2 id="monthTitle">

            July 2026

        </h2>

        <div class="settingsSummary">

            <div>

                <span>Budget</span>

                <strong id="monthBudget">

                    $250.00

                </strong>

            </div>

            <div>

                <span>Spent</span>

                <strong id="monthSpent">

                    $81.25

                </strong>

            </div>

            <div>

                <span>Remaining</span>

                <strong id="monthRemaining">

                    $168.75

                </strong>

            </div>

        </div>

        <ul
            id="monthExpenseList"
            class="expenseList">

        </ul>

        <div
            id="monthEmptyState"
            class="emptyState hidden">

            No expenses for this month.

        </div>

        <div class="modalButtons">

            <button
                id="closeMonth"
                class="secondaryButton">

                Back

            </button>

        </div>

    </div>

</div>

<!-- ==========================================
     EDIT EXPENSE MODAL
========================================== -->

<div
    id="editModal"
    class="modal hidden">

    <div class="modalCard">

        <h2>

            Edit Expense

        </h2>

        <label>

            Description

            <input
                id="editDescription"
                type="text">

        </label>

        <label>

            Amount

            <input
                id="editAmount"
                type="number"
                step="0.01">

        </label>

        <div class="modalButtons">

            <button
                id="deleteExpense"
                class="dangerButton">

                Delete

            </button>

            <button
                id="updateExpense"
                class="primaryButton">

                Save

            </button>

        </div>

    </div>

</div>

<!-- ==========================================
     EXPENSE TEMPLATE
========================================== -->

<template id="expenseTemplate">

    <li class="expenseItem">

        <div class="expenseInfo">

            <div class="expenseDescription"></div>

            <div class="expenseDate"></div>

        </div>

        <div class="expenseAmount"></div>

    </li>

</template>

<!-- ==========================================
     HISTORY TEMPLATE
========================================== -->

<template id="historyTemplate">

    <div class="historyItem">

        <div class="historyInfo">

            <div class="historyMonth"></div>

            <div class="historyTotals"></div>

        </div>

        <div class="historyArrow">

            ›

        </div>

    </div>

</template>

<script src="script.js"></script>

</body>
</html>
